<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClipFactory — Editor v0.031</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="theme-color" content="#07140e">
<style>
:root{
  --bg:#030705;--bg2:#07140e;--panel:rgba(8,22,15,.94);--border:rgba(34,197,94,.24);--border2:rgba(74,222,128,.58);
  --txt:#e9fff2;--muted:#84a893;--accent:#22c55e;--btn-g1:#0f5132;--btn-g2:#146c43;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(180deg, var(--bg2), var(--bg));color:var(--txt);font-family:system-ui,-apple-system,sans-serif;padding-bottom:44px}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:900;font-size:20px} .logo span{color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
button{background:linear-gradient(135deg,var(--btn-g2),var(--btn-g1));color:#fff;border:1px solid var(--border2);border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}
button.ghost{background:rgba(12,34,23,.82);border-color:var(--border);color:#bbf7d0}
button.small{padding:5px 9px;font-size:11px}
input,select{background:rgba(3,10,7,.92);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:8px;font-size:13px;width:100%;margin-top:4px}
.hidden{display:none!important}
#appVersion{position:fixed;right:14px;bottom:10px;font-size:11px;font-weight:800;color:#86efac;background:rgba(5,16,10,.88);border:1px solid var(--border);padding:4px 10px;border-radius:99px}
</style>
</head>
<body>
<header>
  <div class="logo">Clip<span>Factory</span></div>
  <div style="flex:1"></div>
  <a href="./redes.html" class="ghost small" style="text-decoration:none;display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;margin-right:8px">🔗 Redes Sociais</a>
  <a href="./login.html" class="ghost small" style="text-decoration:none">Sair</a>
</header>
<main>
  <section id="step1" class="card">
    <h2>1. Enviar Vídeo</h2>
    <input type="file" id="fileInput" accept="video/*">
  </section>

  <section id="editor" class="hidden">
    <div class="card">
      <h2>2. Visualização & Ações</h2>
      <video id="videoEl" controls style="width:100%;max-height:300px;background:#000;border-radius:10px"></video>
      <button id="analyzeBtn" style="margin-top:10px;width:100%">🧠 Analisar e Gerar Cortes</button>
    </div>

    <div class="card">
      <h2>3. Lista de Cortes Gerados</h2>
      <div id="clipList"></div>
    </div>

    <div class="card">
      <h2>4. Formato de Exportação (Padrão: MP4)</h2>
      <label>Selecione o formato desejado para baixar localmente:</label>
      <select id="expMode">
        <option value="mp4" selected>MP4 Vertical (Recomendado / Padrão Redes)</option>
        <option value="avi">AVI Vertical (Alternativo)</option>
      </select>
      <p style="font-size:11px;color:var(--muted);margin-top:6px">* Nota: O envio automático para as redes sociais conectadas exige e envia obrigatoriamente no formato **MP4**.</p>
      <button id="exportBtn" style="margin-top:10px;width:100%">⬇ Baixar Corte Atual</button>
      <div id="expLog" style="font-size:11px;color:#86efac;margin-top:8px"></div>
    </div>
  </section>
</main>
<div id="appVersion">v0.031</div>
<script src="./presets.js"></script>
<script src="./app.js"></script>
<script src="./wallet.js"></script>
</body>
</html>
