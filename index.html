<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipFactory — Estúdio & Publicação</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; min-height: 100vh; }
    header {
      background: #131a2a;
      border-bottom: 1px solid #1e293b;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.2rem; }
    .badge {
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .diamonds-pill {
      background: #0b0f19;
      border: 1px solid #334155;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #38bdf8;
    }
    button {
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #6366f1; border-color: #6366f1; }
    button.primary:hover { background: #4f46e5; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .card {
      background: #131a2a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 1.25rem;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 0.75rem; }
    .video-title { font-weight: 600; margin-bottom: 0.4rem; }
    .meta { color: #94a3b8; font-size: 0.82rem; margin-bottom: 1rem; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #131a2a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 460px;
    }
    .modal h3 { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.35rem; }
    input, select {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b0f19;
      color: #f8fafc;
      margin-bottom: 0.9rem;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.5rem; }
    .account-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.75rem;
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-bottom: 0.6rem;
      font-size: 0.88rem;
    }
    .status-toast {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      font-size: 0.88rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>ClipFactory</span>
      <span class="badge">v0.032</span>
    </div>
    <div class="header-actions">
      <div class="diamonds-pill">💎 <span id="diamondCount">250</span> diamantes</div>
      <button id="openAccountsBtn" type="button">Contas sociais</button>
      <button id="logoutBtn" type="button">Sair</button>
    </div>
  </header>

  <main>
    <div class="grid" id="videosList"></div>
    <div class="status-toast" id="statusToast"></div>
  </main>

  <!-- Modal de Envio para Redes Sociais -->
  <div class="modal-backdrop" id="publishModal">
    <div class="modal">
      <h3>Enviar vídeo para rede social</h3>
      <label for="editVideoTitle">Título do vídeo</label>
      <input id="editVideoTitle" type="text" />
      <label for="targetPlatform">Conta social de destino</label>
      <select id="targetPlatform"></select>
      <p class="meta">Custo unitário: <strong>50 diamantes</strong> por envio.</p>
      <div class="modal-footer">
        <button id="cancelPublishBtn" type="button">Cancelar</button>
        <button id="confirmPublishBtn" class="primary" type="button">Confirmar envio (-50 💎)</button>
      </div>
    </div>
  </div>

  <!-- Modal de Gestão e Vinculação de Contas Sociais -->
  <div class="modal-backdrop" id="accountsModal">
    <div class="modal">
      <h3>Contas sociais vinculadas</h3>
      <div id="accountsList"></div>
      <label for="newPlatform">Nova plataforma</label>
      <select id="newPlatform">
        <option value="TikTok">TikTok</option>
        <option value="Instagram Reels">Instagram Reels</option>
        <option value="YouTube Shorts">YouTube Shorts</option>
      </select>
      <label for="newHandle">@utilizador / canal</label>
      <input id="newHandle" type="text" placeholder="@meu_canal" />
      <div class="modal-footer">
        <button id="closeAccountsBtn" type="button">Fechar</button>
        <button id="linkAccountBtn" class="primary" type="button">Vincular conta</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
