<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClipFactory — Entrar</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#07140e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#030705;
  --bg2:#07140e;
  --card:rgba(8,22,15,.94);
  --border:rgba(34,197,94,.24);
  --border-hi:rgba(74,222,128,.58);
  --txt:#e9fff2;
  --muted:#84a893;
  --btn-g1:#0f5132;
  --btn-g2:#146c43;
  --btn-g-hover:#198754;
  --accent:#22c55e;
  --upd-bg:#1a0608;
  --upd-btn:#991b1b;
  --upd-btn-hover:#dc2626;
  --upd-border:rgba(248,113,113,.45);
  --upd-txt:#fecaca;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(820px 440px at 80% -10%, rgba(20,108,67,.30), transparent 60%),
    radial-gradient(640px 400px at -10% 90%, rgba(15,81,50,.26), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg));
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 16px 52px;
}

.login-box{
  width:100%;
  max-width:410px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:26px 22px;
  box-shadow:0 18px 48px rgba(0,0,0,.68);
  backdrop-filter:blur(12px);
}

.brand{
  text-align:center;
  margin-bottom:20px;
}
.brand-badge{
  display:inline-block;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:#86efac;
  background:rgba(20,108,67,.28);
  border:1px solid var(--border);
  padding:4px 12px;
  border-radius:99px;
  margin-bottom:10px;
}
.brand h1{
  font-size:28px;
  font-weight:900;
  letter-spacing:.4px;
}
.brand h1 span{color:var(--accent)}
.brand p{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

#updateBanner{
  display:none;
  background:var(--upd-bg);
  border:1px solid var(--upd-border);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:16px;
}
#updateBanner.show{display:block}
.upd-title{
  font-size:12px;
  font-weight:800;
  color:var(--upd-txt);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.btn-update{
  width:100%;
  background:linear-gradient(135deg, var(--upd-btn), #7f1d1d);
  color:#ffffff;
  border:1px solid var(--upd-border);
  border-radius:11px;
  padding:11px 14px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}
.btn-update:hover{
  background:linear-gradient(135deg, var(--upd-btn-hover), var(--upd-btn));
  box-shadow:0 0 18px rgba(220,38,38,.42);
}

.field{margin-bottom:14px}
label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#b7dec7;
  margin-bottom:6px;
}
input{
  width:100%;
  background:rgba(3,10,7,.92);
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px 13px;
  color:var(--txt);
  font-size:14px;
  outline:none;
  transition:.15s;
}
input:focus{
  border-color:var(--border-hi);
  box-shadow:0 0 0 3px rgba(34,197,94,.16);
}

.btn-primary{
  width:100%;
  background:linear-gradient(135deg, var(--btn-g2), var(--btn-g1));
  color:#fff;
  border:1px solid var(--border-hi);
  border-radius:12px;
  padding:12px 16px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 6px 20px rgba(20,108,67,.35);
}
.btn-primary:hover{
  background:linear-gradient(135deg, var(--btn-g-hover), var(--btn-g2));
  box-shadow:0 0 22px rgba(34,197,94,.42);
}

.btn-secondary{
  width:100%;
  margin-top:10px;
  background:rgba(12,34,23,.82);
  color:#bbf7d0;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 16px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}
.btn-secondary:hover{
  border-color:var(--border-hi);
  background:rgba(20,108,67,.32);
}

.msg{
  margin-top:12px;
  font-size:12px;
  min-height:18px;
  text-align:center;
  color:#86efac;
  word-break:break-word;
}
.msg.err{color:#fca5a5}

.divider{
  height:1px;
  background:var(--border);
  margin:18px 0 14px;
}

.foot-links{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--muted);
  gap:10px;
  flex-wrap:wrap;
}
.foot-links a{
  color:#86efac;
  text-decoration:none;
  font-weight:700;
}
.foot-links a:hover{text-decoration:underline}

#appVersion{
  position:fixed;
  right:14px;
  bottom:10px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.6px;
  color:#86efac;
  background:rgba(5,16,10,.88);
  border:1px solid var(--border);
  padding:4px 10px;
  border-radius:99px;
  z-index:30;
}

.btn-install{
  width:100%;
  margin-top:10px;
  background:linear-gradient(135deg,#0f5132,#146c43);
  color:#ffffff;
  border:1px solid rgba(74,222,128,.55);
  border-radius:12px;
  padding:12px 16px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 6px 20px rgba(20,108,67,.35);
}
.btn-install:hover{
  background:linear-gradient(135deg,#198754,#146c43);
  box-shadow:0 0 22px rgba(34,197,94,.42);
}
</style>

<style id="cfBgOverride">
  body {
    background: linear-gradient(rgba(3, 7, 5, 0.78), rgba(3, 7, 5, 0.88)), url("./splash-bg.jpg") center center / cover fixed no-repeat !important;
  }
</style>
</head>
<body>
<div class="login-box">
  <div class="brand">
    <div class="brand-badge">WaveCombat Hub</div>
    <h1>Clip<span>Factory</span></h1>
    <p>Acesse com sua conta do Hub ou entre no modo local</p>
  </div>

  <section id="updateBanner" aria-live="polite">
    <div class="upd-title">
      <span>Nova versão disponível</span>
      <span id="remoteVerLabel"></span>
    </div>
    <button type="button" class="btn-update" id="updateBtn">Atualizar para nova versão agora</button>
  </section>

  <form id="loginForm">
    <div class="field">
      <label for="userInput">ID do Jogador, Nick ou E-mail</label>
      <input type="text" id="userInput" placeholder="Ex.: 1042, Capudo ou email@exemplo.com" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="passInput">Senha</label>
      <input type="password" id="passInput" placeholder="Digite sua senha" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">Entrar no ClipFactory</button>
  </form>

  <button type="button" class="btn-secondary" id="localModeBtn">Entrar no modo local (sem conta)</button>
  <button type="button" class="btn-install" id="installPwaBtn" style="display:none">📲 Instalar aplicativo</button>

  <div class="msg" id="msgBox"></div>

  <div class="divider"></div>

  <div class="foot-links">
    <a href="https://wavecombat-hub.onrender.com/#inicio" target="_blank" rel="noopener">Criar conta no Hub</a>
    <a href="https://youtube.com/@capudooficial7?si=awSkNhuT4YY177Yp" target="_blank" rel="noopener">Canal oficial</a>
  </div>
</div>

<div id="appVersion">v0.034</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  window.latestUpdateUrl = "./index.html";
  window.CLIPFACTORY_VERSION = "0.034";
})();
</script>
<script>
async function triggerRealUpdate(btnEl, statusFn) {
  if (btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = "Baixando e aplicando atualização…";
  }
  if (statusFn) statusFn("Baixando nova versão e limpando cache antigo…", "ok");
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        await r.update().catch(() => {});
        if (r.waiting) r.waiting.postMessage({ type: "SKIP_WAITING" });
      }
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    const coreFiles = ["./index.html", "./login.html", "./editor.html", "./app.js", "./wallet.js", "./presets.js", "./manifest.json", "./version.json"];
    await Promise.all(coreFiles.map(u => fetch(`${u}?_upd=${Date.now()}`, { cache: "no-store" }).catch(() => null)));
  } catch (e) {}

  if (window.__cfPackageUrl) {
    const dl = document.createElement("a");
    dl.href = window.__cfPackageUrl;
    dl.download = window.__cfPackageUrl.split("/").pop() || "clipfactory-update.zip";
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
  }

  const target = (window.latestUpdateUrl || "./index.html");
  const sep = target.includes("?") ? "&" : "?";
  const ver = window.CLIPFACTORY_VERSION || "0.034";
  setTimeout(() => {
    window.location.replace(`${target}${sep}v=${ver}&t=${Date.now()}`);
  }, 350);
}
</script>
<script>
"use strict";

const APP_VERSION = "0.034";
const SUPABASE_URL = "https://ipqjeacdfiomcxfuixdj.supabase.co";
const SUPABASE_KEY = "sb_publishable_EWW84q_43YbOvMwB_Rua-A_X465PbLP";

const msgBox = document.getElementById("msgBox");
const userInput = document.getElementById("userInput");
const passInput = document.getElementById("passInput");
const loginBtn = document.getElementById("loginBtn");
const localModeBtn = document.getElementById("localModeBtn");
const updateBanner = document.getElementById("updateBanner");
const updateBtn = document.getElementById("updateBtn");
const remoteVerLabel = document.getElementById("remoteVerLabel");

document.getElementById("appVersion").textContent = "v" + APP_VERSION;

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

let deferredInstallPrompt = null;
const installPwaBtn = document.getElementById("installPwaBtn");

function showInstallButtonIfPossible() {
  if (!installPwaBtn) return;
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (!isStandalone) {
    installPwaBtn.style.display = "block";
  }
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallButtonIfPossible();
});

if (installPwaBtn) {
  installPwaBtn.addEventListener("click", async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice.catch(() => null);
      deferredInstallPrompt = null;
      if (choice && choice.outcome === "accepted") {
        installPwaBtn.style.display = "none";
      }
      return;
    }
    setMsg("No navegador, abra o menu (⋮) e toque em 'Instalar aplicativo' ou 'Adicionar à tela inicial'.", false);
  });
}

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  if (installPwaBtn) installPwaBtn.style.display = "none";
  setMsg("ClipFactory instalado com sucesso!", false);
});

showInstallButtonIfPossible();

function setMsg(text, isErr = false) {
  msgBox.textContent = text || "";
  msgBox.className = isErr ? "msg err" : "msg";
}

function isNewerVersion(remoteVer, localVer) {
  if (!remoteVer) return false;
  const r = String(remoteVer).trim().split(".").map(n => parseInt(n, 10) || 0);
  const l = String(localVer).trim().split(".").map(n => parseInt(n, 10) || 0);
  const len = Math.max(r.length, l.length);
  for (let i = 0; i < len; i++) {
    if ((r[i] || 0) > (l[i] || 0)) return true;
    if ((r[i] || 0) < (l[i] || 0)) return false;
  }
  return false;
}

async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const res = await fetch(`./version.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.package_url) { window.__cfPackageUrl = data.package_url; }
    if (data && isNewerVersion(data.version, APP_VERSION)) {
      remoteVerLabel.textContent = `v${data.version}`;
      updateBanner.classList.add("show");
    }
  } catch (e) {}
}

updateBtn.addEventListener("click", () => triggerRealUpdate(updateBtn, setMsg));

function goToEditor(playerId, nick = "") {
  const params = new URLSearchParams(window.location.search);
  if (playerId) {
    params.set("id", playerId);
  } else {
    params.delete("id");
  }
  try {
    sessionStorage.setItem("cf_session_user", JSON.stringify({
      id_jogador: playerId || "LOCAL",
      nick: nick || "Modo Local",
      ts: Date.now()
    }));
  } catch (e) {}
  const qs = params.toString();
  window.location.href = "./editor.html" + (qs ? "?" + qs : "");
}

function getSb() {
  if (!window.supabase) return null;
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function extractPassword(row) {
  if (!row || typeof row !== "object") return "";
  for (const k of ["senha", "password", "senha_hash", "pass", "pwd"]) {
    if (row[k] !== undefined && row[k] !== null) return String(row[k]);
  }
  return "";
}

function matchesPassword(storedPass, rawPass) {
  const s = String(storedPass ?? "");
  const r = String(rawPass ?? "");
  if (!s) return false;
  if (s === r) return true;
  if (s.trim() === r.trim()) return true;
  return false;
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const rawUser = userInput.value.trim();
  const rawPass = passInput.value;

  if (!rawUser || !rawPass) {
    setMsg("Preencha usuário e senha.", true);
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Verificando conta...";
  setMsg("");

  try {
    const sb = getSb();
    if (!sb) {
      throw new Error("Serviço de autenticação indisponível no momento.");
    }

    const needle = rawUser.toLowerCase();
    let rows = [];

    if (/^\d+$/.test(rawUser)) {
      const byId = await sb.from("usuarios").select("*").eq("id_jogador", rawUser).limit(5);
      if (byId.error) {
        throw new Error("Erro Supabase (id_jogador): " + byId.error.message);
      }
      rows = byId.data || [];
    }

    if (!rows.length) {
      const broad = await sb.from("usuarios").select("*").limit(500);
      if (broad.error) {
        throw new Error("Erro Supabase (usuarios): " + broad.error.message);
      }
      rows = (broad.data || []).filter(r => {
        const idVal = String(r.id_jogador ?? r.id ?? "").trim().toLowerCase();
        const nickVal = String(r.nick ?? r.usuario ?? r.nome ?? "").trim().toLowerCase();
        const emailVal = String(r.email ?? "").trim().toLowerCase();
        return idVal === needle || nickVal === needle || emailVal === needle;
      });
    }

    if (!rows.length) {
      setMsg("Conta não encontrada no Hub (verifique o ID, Nick ou E-mail).", true);
      loginBtn.disabled = false;
      loginBtn.textContent = "Entrar no ClipFactory";
      return;
    }

    const user = rows.find(row => matchesPassword(extractPassword(row), rawPass));

    if (!user) {
      setMsg("Senha incorreta para a conta encontrada.", true);
      loginBtn.disabled = false;
      loginBtn.textContent = "Entrar no ClipFactory";
      return;
    }

    const resolvedId = String(user.id_jogador ?? user.id ?? rawUser);
    const resolvedNick = String(user.nick ?? user.nome ?? rawUser);
    setMsg(`Bem-vindo, ${resolvedNick}! Redirecionando...`);
    setTimeout(() => goToEditor(resolvedId, resolvedNick), 350);
  } catch (err) {
    setMsg(err.message || "Erro ao entrar.", true);
    loginBtn.disabled = false;
    loginBtn.textContent = "Entrar no ClipFactory";
  }
});

localModeBtn.addEventListener("click", () => {
  goToEditor("", "Modo Local");
});

try {
  const saved = JSON.parse(sessionStorage.getItem("cf_session_user") || "null");
  if (saved && saved.id_jogador && saved.id_jogador !== "LOCAL" && !userInput.value) {
    userInput.value = saved.id_jogador;
  }
} catch (e) {}

checkForUpdate();
</script>
</body>
</html>
