<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipFactory — Entrar</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#030705">
  <style>
    :root {
      --bg: #030705;
      --panel: #08160f;
      --card: #0c2217;
      --border: rgba(34, 197, 94, 0.28);
      --txt: #e9fff2;
      --muted: #84a893;
      --acc: #22c55e;
      --acc-hover: #16a34a;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 390px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--acc);
      color: var(--acc);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .title { font-size: 24px; font-weight: 800; color: #4ade80; margin-bottom: 4px; }
    .sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    .input-group { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; background: #040d08; color: var(--txt); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--acc); }
    .btn {
      background: linear-gradient(135deg, #146c43, #0f5132); color: #fff;
      border: 1px solid rgba(74, 222, 128, 0.5); border-radius: 10px; padding: 12px;
      font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: linear-gradient(135deg, #198754, #146c43); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 12px; font-size: 12px; min-height: 18px; color: var(--muted); }
    .msg.err { color: var(--danger); }
    .ver { position: fixed; bottom: 12px; right: 16px; font-size: 10px; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="badge">PWA • ClipFactory v0.032</div>
    <div class="title">ClipFactory</div>
    <div class="sub">Entre com seu usuário/ID e senha do Hub</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="userInput">Usuário ou ID (id_jogador)</label>
        <input type="text" id="userInput" placeholder="Digite seu ID ou nick" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="passInput">Senha</label>
        <input type="password" id="passInput" placeholder="••••••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Entrar no aplicativo</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <div class="ver">v0.032</div>

  <script>
    const SUPABASE_URL = "https://ipqjeacdfiomcxfuixdj.supabase.co";
    const SUPABASE_ANON_KEY = localStorage.getItem("clipfactory_sb_anon_key") || "";

    function setMsg(text, isErr = false) {
      const el = document.getElementById("loginMsg");
      el.textContent = text || "";
      el.className = isErr ? "msg err" : "msg";
    }

    async function authenticateUser(idJogador, pass) {
      if (!SUPABASE_ANON_KEY) {
        return {
          ok: true,
          offlineFallback: true,
          user: { id_jogador: idJogador, nick: idJogador, pass }
        };
      }

      const headers = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json"
      };

      const url = `${SUPABASE_URL}/rest/v1/usuarios?id_jogador=eq.${encodeURIComponent(idJogador)}&select=*`;
      const resp = await fetch(url, { headers });
      if (!resp.ok) {
        throw new Error(`Falha ao consultar usuários (${resp.status})`);
      }

      const rows = await resp.json();
      if (!Array.isArray(rows) || rows.length === 0) {
        return { ok: false, error: "Usuário ou ID não encontrado." };
      }

      const account = rows[0];
      const storedPass = account.pass ?? account.senha ?? "";
      if (String(storedPass) !== String(pass)) {
        return { ok: false, error: "Senha inválida." };
      }

      return {
        ok: true,
        user: {
          id_jogador: String(account.id_jogador),
          nick: account.nick || account.nome || String(account.id_jogador)
        }
      };
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const idJogador = document.getElementById("userInput").value.trim();
      const pass = document.getElementById("passInput").value;

      if (!idJogador || !pass) {
        setMsg("Preencha usuário/ID e senha.", true);
        return;
      }

      btn.disabled = true;
      setMsg("Autenticando...");

      try {
        const result = await authenticateUser(idJogador, pass);
        if (!result.ok) {
          setMsg(result.error || "Não foi possível entrar.", true);
          btn.disabled = false;
          return;
        }

        localStorage.setItem("clipfactory_user", JSON.stringify(result.user));
        setMsg("Acesso liberado! Abrindo ClipFactory...");
        window.location.href = "./index.html";
      } catch (err) {
        setMsg(err.message || "Erro ao autenticar.", true);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
