<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipFactory — Entrar</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #131a2a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.4rem; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b0f19;
      color: #f8fafc;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .msg { margin-top: 0.9rem; font-size: 0.85rem; color: #f87171; min-height: 1.2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ClipFactory</h1>
    <p class="sub">Versão v0.032 • Entre na sua conta</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" required placeholder="voce@exemplo.com" />
      <label for="password">Palavra-passe</label>
      <input id="password" type="password" required placeholder="••••••••" />
      <button type="submit">Entrar</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
