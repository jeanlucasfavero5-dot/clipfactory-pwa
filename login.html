<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClipFactory — Entrar</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#07140e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#030705;
  --bg2:#07140e;
  --card:rgba(8,22,15,.94);
  --border:rgba(34,197,94,.24);
  --border-hi:rgba(74,222,128,.58);
  --txt:#e9fff2;
  --muted:#84a893;
  --btn-g1:#0f5132;
  --btn-g2:#146c43;
  --btn-g-hover:#198754;
  --accent:#22c55e;
  --upd-bg:#1a0608;
  --upd-btn:#991b1b;
  --upd-btn-hover:#dc2626;
  --upd-border:rgba(248,113,113,.45);
  --upd-txt:#fecaca;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:
    linear-gradient(rgba(3, 7, 5, 0.72), rgba(3, 7, 5, 0.84)),
    url("./splash-bg.jpg") center center / cover fixed no-repeat;
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 16px 52px;
}
.login-box{
  width:100%;
  max-width:410px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:26px 22px;
  box-shadow:0 18px 48px rgba(0,0,0,.68);
  backdrop-filter:blur(12px);
}
.brand{text-align:center;margin-bottom:20px}
.brand-badge{
  display:inline-block;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:#86efac;
  background:rgba(20,108,67,.28);
  border:1px solid var(--border);
  padding:4px 12px;
  border-radius:99px;
  margin-bottom:10px;
}
.brand h1{font-size:28px;font-weight:900;letter-spacing:.4px}
.brand h1 span{color:var(--accent)}
.brand p{font-size:13px;color:var(--muted);margin-top:4px}
#updateBanner{
  display:none;
  background:var(--upd-bg);
  border:1px solid var(--upd-border);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:16px;
}
#updateBanner.show{display:block}
.upd-title{
  font-size:12px;
  font-weight:800;
  color:var(--upd-txt);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.btn-update{
  width:100%;
  background:linear-gradient(135deg, var(--upd-btn), #7f1d1d);
  color:#ffffff;
  border:1px solid var(--upd-border);
  border-radius:11px;
  padding:11px 14px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}
.btn-update:hover{background:linear-gradient(135deg, var(--upd-btn-hover), var(--upd-btn))}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:#b7dec7;margin-bottom:6px}
.input-wrap{position:relative;display:flex;align-items:center}
input[type="text"],input[type="password"]{
  width:100%;
  background:rgba(3,10,7,.92);
  border:1px solid var(--border);
  color:var(--txt);
  border-radius:12px;
  padding:12px 42px 12px 13px;
  font-size:14px;
  outline:none;
}
input:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.eye-btn{
  position:absolute;right:8px;background:transparent;border:0;
  color:var(--muted);font-size:15px;cursor:pointer;padding:6px;
}
.options-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:16px;font-size:12px;color:var(--muted);
}
.remember-label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;margin:0;color:var(--txt)}
.remember-label input{accent-color:var(--accent);width:15px;height:15px}
.btn-primary{
  width:100%;
  background:linear-gradient(135deg, var(--btn-g2), var(--btn-g1));
  color:#ffffff;
  border:1px solid var(--border-hi);
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg, var(--btn-g-hover), var(--btn-g2))}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.btn-secondary{
  width:100%;margin-top:9px;
  background:rgba(15,81,50,.22);color:#bbf7d0;
  border:1px solid var(--border);border-radius:12px;
  padding:11px 14px;font-size:14px;font-weight:800;cursor:pointer;min-height:42px;
}
#statusBox{margin-top:14px;font-size:12px;line-height:1.45;min-height:18px;text-align:center;color:var(--muted)}
#statusBox.err{color:#fca5a5;font-weight:700}
#statusBox.ok{color:#86efac;font-weight:700}
.footer-links{
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(34,197,94,.14);
  display:flex;justify-content:space-between;gap:10px;font-size:12px;
}
.footer-links a{color:#86efac;text-decoration:none;font-weight:700}
#appVersion{
  position:fixed;right:14px;bottom:10px;font-size:11px;font-weight:800;letter-spacing:.6px;
  color:#86efac;background:rgba(5,16,10,.88);border:1px solid var(--border);
  padding:4px 10px;border-radius:99px;z-index:20;
}
</style>
</head>
<body>

<main class="login-box">
  <div class="brand">
    <div class="brand-badge">PWA • Conta do Hub</div>
    <h1>Clip<span>Factory</span></h1>
    <p>Entre com seu usuário/ID e senha para acessar sua carteira e cortes</p>
  </div>

  <section id="updateBanner" aria-live="polite">
    <div class="upd-title">
      <span>Atualização disponível</span>
      <span id="remoteVerLabel"></span>
    </div>
    <button type="button" class="btn-update" id="updateBtn">Atualizar para nova versão agora</button>
  </section>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="loginUser">Usuário ou ID do jogador</label>
      <div class="input-wrap">
        <input type="text" id="loginUser" name="username" placeholder="Ex.: capudo7 ou seu ID" required>
      </div>
    </div>

    <div class="field">
      <label for="loginPass">Senha</label>
      <div class="input-wrap">
        <input type="password" id="loginPass" name="password" placeholder="Digite sua senha" required>
        <button type="button" class="eye-btn" id="togglePassBtn" title="Mostrar ou ocultar senha">👁</button>
      </div>
    </div>

    <div class="options-row">
      <label class="remember-label">
        <input type="checkbox" id="rememberChk" checked>
        Lembrar usuário
      </label>
      <button type="button" id="checkUpdManualBtn" style="background:none;border:0;color:#86efac;font-size:12px;font-weight:700;cursor:pointer">
        Checar versão
      </button>
    </div>

    <button type="submit" class="btn-primary" id="loginSubmitBtn">Entrar no aplicativo</button>
    <button type="button" class="btn-secondary" id="installPwaBtn">📲 Instalar aplicativo no celular</button>
  </form>

  <div id="statusBox"></div>

  <div class="footer-links">
    <a href="https://wavecombat-hub.onrender.com/#inicio" target="_blank" rel="noopener">Comprar Diamantes / Criar conta</a>
    <a href="./editor.html">Abrir modo local</a>
  </div>
</main>

<div id="appVersion">v0.018</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const APP_VERSION = "0.018";
const VERSION_CHECK_URL = "./version.json";
const SUPABASE_URL = "https://ipqjeacdfiomcxfuixdj.supabase.co";
const SUPABASE_KEY = "sb_publishable_EWW84q_43YbOvMwB_Rua-A_X465PbLP";

const $ = id => document.getElementById(id);
let deferredInstallPrompt = null;
let latestUpdateUrl = "./index.html";

$("appVersion").textContent = "v" + APP_VERSION;

function setStatus(msg, type = "") {
  const box = $("statusBox");
  box.textContent = msg;
  box.className = type;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

$("togglePassBtn").addEventListener("click", () => {
  const inp = $("loginPass");
  const isPass = inp.type === "password";
  inp.type = isPass ? "text" : "password";
  $("togglePassBtn").textContent = isPass ? "🙈" : "👁";
});

(function initSavedLogin() {
  try {
    const saved = localStorage.getItem("cf_saved_login_user");
    if (saved) {
      $("loginUser").value = saved;
      $("rememberChk").checked = true;
    }
  } catch (e) {}
})();

function isNewerVersion(remoteVer, localVer) {
  if (!remoteVer) return false;
  const rParts = String(remoteVer).trim().split(".").map(n => parseInt(n, 10) || 0);
  const lParts = String(localVer).trim().split(".").map(n => parseInt(n, 10) || 0);
  const len = Math.max(rParts.length, lParts.length);
  for (let i = 0; i < len; i++) {
    const a = rParts[i] || 0;
    const b = lParts[i] || 0;
    if (a > b) return true;
    if (a < b) return false;
  }
  return false;
}

async function checkForUpdates(showFeedbackIfUpToDate = false) {
  if (!navigator.onLine) {
    if (showFeedbackIfUpToDate) setStatus("Sem conexão no momento para checar atualização.", "err");
    return;
  }
  try {
    const res = await fetch(`${VERSION_CHECK_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (data && isNewerVersion(data.version, APP_VERSION)) {
      latestUpdateUrl = data.url || "./index.html";
      $("remoteVerLabel").textContent = `v${data.version}`;
      $("updateBanner").classList.add("show");
    } else {
      $("updateBanner").classList.remove("show");
      if (showFeedbackIfUpToDate) {
        setStatus(`Você já está na versão mais recente (v${APP_VERSION}).`, "ok");
      }
    }
  } catch (e) {
    if (showFeedbackIfUpToDate) setStatus("Não foi possível verificar atualização agora.", "err");
  }
}

async function triggerRealUpdate(btnEl) {
  if (btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = "Baixando e aplicando atualização…";
  }
  setStatus("Limpando cache antigo e recarregando…", "ok");
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        await r.update().catch(() => {});
        if (r.waiting) r.waiting.postMessage({ type: "SKIP_WAITING" });
      }
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  setTimeout(() => {
    window.location.replace(`${latestUpdateUrl}?v=${APP_VERSION}&t=${Date.now()}`);
  }, 300);
}

$("checkUpdManualBtn").addEventListener("click", () => checkForUpdates(true));
$("updateBtn").addEventListener("click", () => triggerRealUpdate($("updateBtn")));

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

$("installPwaBtn").addEventListener("click", async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  } else {
    alert("Para instalar no celular: toque no menu do navegador (⋮) e escolha 'Instalar aplicativo' ou 'Adicionar à tela inicial'.");
  }
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const identifier = $("loginUser").value.trim();
  const password = $("loginPass").value;
  if (!identifier || !password) return;

  if ($("rememberChk").checked) {
    localStorage.setItem("cf_saved_login_user", identifier);
  } else {
    localStorage.removeItem("cf_saved_login_user");
  }

  const btn = $("loginSubmitBtn");
  btn.disabled = true;
  btn.textContent = "Verificando conta…";
  setStatus("Conectando ao Supabase…");

  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (identifier.includes("@")) {
      const { data: authData, error: authErr } = await sb.auth.signInWithPassword({
        email: identifier,
        password,
      });
      if (!authErr && authData?.user) {
        const playerId = authData.user.user_metadata?.id_jogador || authData.user.id;
        const nick = authData.user.user_metadata?.nick || identifier.split("@")[0];
        let diamantes = 0;
        const wRes = await sb
          .from("carteira_diamantes")
          .select("diamantes")
          .eq("id_jogador", String(playerId))
          .maybeSingle();
        if (!wRes.error && wRes.data) diamantes = Number(wRes.data.diamantes || 0);

        sessionStorage.setItem("cf_session_user", JSON.stringify({
          id_jogador: String(playerId),
          nick,
          diamantes,
          loggedAt: Date.now(),
        }));
        setStatus("Login realizado! Abrindo painel…", "ok");
        window.location.href = `./editor.html?id=${encodeURIComponent(playerId)}`;
        return;
      }
    }

    const byId = await sb
      .from("usuarios")
      .select("*")
      .eq("id_jogador", identifier)
      .maybeSingle();

    let userRow = byId.data;
    if (!userRow) {
      const byNick = await sb
        .from("usuarios")
        .select("*")
        .ilike("nick", identifier)
        .maybeSingle();
      userRow = byNick.data;
    }

    if (!userRow) {
      throw new Error("Usuário ou ID não encontrado. Verifique seus dados ou crie conta no Hub.");
    }

    const storedPass = userRow.senha ?? userRow.password ?? null;
    if (storedPass !== null && String(storedPass) !== password) {
      throw new Error("Senha incorreta.");
    }

    const playerId = String(userRow.id_jogador);
    const nick = String(userRow.nick || playerId);

    let diamantes = 0;
    const wRes = await sb
      .from("carteira_diamantes")
      .select("diamantes")
      .eq("id_jogador", playerId)
      .maybeSingle();
    if (!wRes.error && wRes.data) {
      diamantes = Number(wRes.data.diamantes || 0);
    }

    sessionStorage.setItem("cf_session_user", JSON.stringify({
      id_jogador: playerId,
      nick,
      diamantes,
      loggedAt: Date.now(),
    }));

    setStatus(`Bem-vindo, ${nick}! Saldo: ${diamantes} diamantes.`, "ok");
    window.location.href = `./editor.html?id=${encodeURIComponent(playerId)}`;
  } catch (err) {
    setStatus(err.message || "Falha ao entrar.", "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Entrar no aplicativo";
  }
});

window.addEventListener("DOMContentLoaded", () => {
  checkForUpdates(false);
});
</script>
</body>
</html>
